ritual:
  # How long the ritual lasts once started.
  duration-seconds: 600
  # The altar: a square platform made of this block directly UNDER the placed Revive Beacon.
  platform-block: GOLD_BLOCK
  # 1 = 3x3, 2 = 5x5 ...
  platform-radius: 1
  # Coordinates are announced to the whole server when the ritual begins.
  broadcast-coordinates: true
  # Re-announce coordinates + time left every N seconds (0 = never).
  reminder-interval-seconds: 60
  keep-chunk-loaded: true

events:
  enabled: true
  # How often a new random event starts, in hours (decimals ok: 0.5 = 30 min).
  interval-hours: 12
  # How long each event lasts, in hours. 0 = until the next event starts.
  # Can't be longer than interval-hours. In game: /sb time interval|duration <value>
  duration-hours: 0
  announce-sound: true
  # Chance that a roll gives a BLESSING (good event) instead of a curse.
  good-event-chance: 0.3
  # Chance per roll for SUPER HELL (rare, every curse at once). 0 = only via /sb event set super_hell
  super-hell-chance: 0.05
  # Suspense countdown (seconds) before a scheduled event starts. 0 = no countdown.
  # Super Hell is announced by name during the countdown, other events stay a surprise.
  warning-seconds: 10
  # Event ids to exclude from the rotation, e.g. [the_silence, no_escape, super_hell]
  disabled: []

  blood-moon:
    damage-multiplier: 2.0
  soul-drain:
    hearts: 1
  fragile-world:
    radius: 12
    attempts-per-player: 25
    interval-ticks: 40
  hunger-games:
    multiplier: 3.0
  beast-awakening:
    health-multiplier: 2.0
    damage-multiplier: 1.5
    speed-multiplier: 1.2
    # Chance that a natural hostile spawn is joined by a second (also buffed) one.
    bonus-spawn-chance: 0.25
  the-silence:
    # Private-message commands are blocked too, otherwise people could still talk.
    blocked-commands: [msg, tell, w, whisper, say, me, teammsg, tm, reply, r]

  # ---- blessings
  soul-surge:
    amplifier: 1        # Regeneration level - 1 (1 = Regeneration II)
  swift-winds:
    amplifier: 1        # Speed II
  ancient-haste:
    amplifier: 1        # Haste II
  iron-skin:
    amplifier: 0        # Resistance I (-20% damage)
  bountiful-drops:
    multiplier: 2       # mob loot x2
  wisdom-of-the-dead:
    multiplier: 2.0     # XP x2

  # ---- SUPER HELL: ALL curses at once, turned up, plus a thunderstorm with lightning.
  super-hell:
    duration-minutes: 30
    include-silence: false    # true = Super Hell also hides chat
    no-elimination: true      # dying in Super Hell does NOT eliminate you - you just respawn
    respawn-delay-ticks: 20
    damage-multiplier: 2.5    # mobs deal 2.5x (Blood Moon: 2x)
    hunger-multiplier: 4.0    # hunger 4x (Hunger Games: 3x)
    hearts: 2                 # everyone loses 2 hearts (Soul Drain: 1)
    health-multiplier: 2.0    # beast mobs: 2x health
    beast-damage-multiplier: 1.5
    speed-multiplier: 1.15
    bonus-spawn-chance: 0.4   # 40% of natural mobs get a second buffed twin
    fragile-attempts: 40
    lightning-chance: 0.025   # per player per second
    # curses NOT included in Super Hell (event ids). Remove one to add it to Super Hell.
    excluded: [acid_rain, butterfingers, phantom_hunt, dizzy_spells, heavy_boots, spoiled_food, spotlight, tired_arms]

  # ---- more curses
  phantom-hunt:
    max-per-player: 2
  dizzy-spells:
    chance-per-second: 0.015  # per player (about once a minute)
    seconds: 8                # how long the nausea lasts
  butterfingers:
    chance-per-second: 0.015  # per player (about once a minute)
  brittle-bones:
    fall-damage-multiplier: 3.0
  acid-rain:
    damage: 0.5               # every 2 seconds under open sky (2.0 = one heart)

  # ---- more blessings
  moonwalk:
    jump-amplifier: 2         # Jump Boost III (+ Slow Falling)
  miners-fortune:
    multiplier: 2             # ores drop x2
  growing-season:
    attempts-per-player: 150  # higher = crops grow faster
  guardian-angel:
    amplifier: 1              # Absorption II = 4 extra hearts, topped up every minute
  shrink-ray:
    scale: 0.5                # player size

  # ---- even more curses
  heavy-boots:
    amplifier: 0              # Slowness I
  spoiled-food:
    hunger-seconds: 8         # Hunger effect after eating
  tired-arms:
    amplifier: 0              # Mining Fatigue I

  # ---- even more blessings
  warriors-spirit:
    amplifier: 0              # Strength I
  lucky-streak:
    amplifier: 2              # Luck III
  magnetic-pull:
    radius: 6.0
    speed: 0.35
