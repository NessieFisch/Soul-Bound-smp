# ------------------------------------------------------------------
#  SOULBOUND SMP
# ------------------------------------------------------------------
prefix: "<dark_gray>[<dark_purple>Soulbound<dark_gray>] <gray>"

hardcore:
  # A player who dies AFTER their one revive was used is permanently banned.
  ban-on-final-death: true
  # Ticks before the death screen is skipped and the player becomes a spectator.
  auto-respawn-delay-ticks: 40
  # Ticks between a final death and the ban (so they can see what happened).
  ban-delay-ticks: 100
  # Eliminated players spectate, but may only roam this many blocks from where
  # they died (stops dead players scouting for the team / finding rituals). 0 = unlimited.
  spectator-radius: 100

revive-beacon:
  recipe:
    shape: ["DTD", "GNG", "OOO"]
    ingredients:
      "D": DIAMOND_BLOCK
      "T": TOTEM_OF_UNDYING
      "G": GOLD_BLOCK
      "N": NETHER_STAR
      "O": OBSIDIAN

heavenly-seal:
  # false = no crafting recipe (admins can still /sb giveseal).
  craftable: true
  # Item the seal looks like (it is identified by a hidden tag, not by material).
  material: NETHER_STAR
  # Sneak + right-click is required, so nobody gets banned by an accidental click.
  require-sneak: true
  # Ticks between the seal landing and the ban/kick (the target is frozen meanwhile).
  ban-delay-ticks: 100
  recipe:
    shape: ["NTN", "DAD", "NTN"]
    ingredients:
      "N": NETHER_STAR
      "T": TOTEM_OF_UNDYING
      "D": DIAMOND_BLOCK
      "A": ENCHANTED_GOLDEN_APPLE

# ------------------------------------------------------------------
#  LEGENDARY WEAPONS
#  craftable:        false = no crafting recipe (admins can still /sb legendary give)
#  max-crafted:      how many can ever be forged on the server (0 = unlimited).
#                    Reset with /sb legendary reset <id> if one is lost for good.
#  cooldown-seconds: power cooldown (only for items that have an activated power)
# ------------------------------------------------------------------
legendary:
  # Visual effects. Turn individual ones off, or scale every particle count with intensity
  # (0.5 = half as many particles, 2 = double) if you need to go easier on clients.
  effects:
    intensity: 1.0
    aura: true          # orbiting lights + a signature effect around whoever holds a weapon
    swing-arc: true     # a coloured slash trail on every swing
    trails: true        # trails behind arrows, tridents, fireballs and leaping players
    hit-effects: true   # a burst and chime on every melee hit
    hud: true           # cooldown bar on the action bar while holding a weapon with a power
    drop-beacons: true  # a pillar of light over dropped legendary weapons
    solid: true         # real glowing beams, rings, bursts, crystals and bolts (block displays): far more visible than particles
    particle-size: 1.6  # how much bigger coloured dust particles are drawn (1.0 = vanilla size)
  # God Elytra flight and mace-smash tuning.
  elytra:
    max-speed: 3.0          # blocks per tick (3.0 = 60 blocks/second); lower it if chunk loading struggles
    smash-damage-cap: 60.0  # cap on the bonus damage of a Sky Smash (mace hit while gliding)
    rebound: true           # bounce upward after a Sky Smash so the dive can be repeated
  weapons:
    god_mace:
      craftable: true
      max-crafted: 1
      cooldown-seconds: 20
      recipe:
        shape: ["NHN", "DMD", "NEN"]
        ingredients:
          "N": NETHER_STAR
          "H": HEAVY_CORE
          "D": DIAMOND_BLOCK
          "M": MACE
          "E": ENCHANTED_GOLDEN_APPLE
    dawnbreaker:
