      max-crafted: 1
      cooldown-seconds: 12
      recipe:
        shape: ["GNG", "DSD", "GTG"]
        ingredients:
          "G": GOLD_BLOCK
          "N": NETHER_STAR
          "D": DIAMOND_BLOCK
          "S": NETHERITE_SWORD
          "T": TOTEM_OF_UNDYING
    soul_reaper:
      craftable: true
      max-crafted: 1
      cooldown-seconds: 25
      recipe:
        shape: ["WNW", "THT", "DDD"]
        ingredients:
          "W": WITHER_SKELETON_SKULL
          "N": NETHER_STAR
          "T": TOTEM_OF_UNDYING
          "H": NETHERITE_HOE
          "D": DIAMOND_BLOCK
    voidpiercer:
